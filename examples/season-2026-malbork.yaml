# Season spec — the single athlete/season-specific input to the plan + report
# engines. Everything here is data, not code: edit this file (or copy it) to
# build a plan for a different athlete or season. The periodization engine
# (scripts/build_plan.py) and the report engine (scripts/build_report.py) read
# it and stay generic.
#
# This particular file is the committed EXAMPLE: a real 2026 season (used with
# the athlete's consent) so the scripts run end-to-end out of the box against
# examples/data/.

meta:
  athlete_id: athlete
  plan_id: goal-2026-malbork
  start_date: 2026-06-22
  starting_ctl: 69.0
  title: "Aithlete — Season Plan & Analysis"
  # Phase-specific weekly-hour envelope (documented in the report).
  volume_ceiling_hours:
    to_first_race: 14
    after_first_race: 17
  equipment_note: >
    New disc rear wheel on the TT bike (bought pre-2025 Castle). Athlete estimate
    20-30 W saved at race speed. At IM power/speed that is ~+1.0-1.3 km/h, i.e.
    6-9 min over 180 km (3-5 min over 90 km) or the same speed at lower normalized
    power — we spend part on speed, part on fresher legs for the run.
  rationale: >
    Two-peak season. Syców 1/2 IM (2026-07-12) is a B-race tune-up off a 5-day
    mini-taper; the A-race is Malbork full IM (2026-09-06). Block order: sharpen
    (W1-2) -> Syców -> reset (W4) -> IM build (W5-9 with a recovery valley W7) ->
    2-week taper. Swim is the limiter (CTL 4.1, ~6h/8wk) so swim freq is held at
    >=3/wk throughout. Bike volume is on the TT bike in race position to convert
    the new disc/aero setup (~20-30 W) into a free IM bike split. The IM block
    runs 4h+2h race-simulation bricks (W6/W8 4.0h ride + 2.0h IM-pace run, W9
    4.5h + 2.0h) in place of a standalone long run those weeks — the athlete has
    used 3+2 bricks durably before and the run is the A-race lever, so we rehearse
    race legs directly. Peak weekly volume is pushed toward the 16-17h ceiling
    (W9 ~16.5h) while staying inside the ramp/ACWR guardrails.

# The A-race becomes the plan's goal_race (drives taper/TSB validation).
# target_splits + compare_* feed the report's "Target race splits" section.
races:
  - name: "Syców 1/2 IM"
    date: 2026-07-12
    bucket: "1/2"
    priority: B
    target_time: "4:20"
    target_swim: "35-36'"
    compare_to_date: 2026-05-30          # Sieraków 2026 (most recent half)
    compare_note: >
      vs Sieraków 2026 (4:45:50): bike -14 min (wheels+fitness), transitions
      -7 min (T1+T2 were 10:55!), run -4 min, swim flat -> ~-26 min.
    splits:
      - { leg: "Swim 1.9 km", target: "36:00", detail: "1:54/100m (wetsuit/OW)" }
      - { leg: "T1",          target: "2:00",  detail: "tighten vs 4:28 in Sieraków" }
      - { leg: "Bike 90 km",  target: "2:16:00", detail: "~39.7 km/h @ 250-262 W (disc/aero)" }
      - { leg: "T2",          target: "1:30",  detail: "tighten vs 6:27 in Sieraków" }
      - { leg: "Run 21.1 km", target: "1:24:30", detail: "4:00/km" }

  - name: "Malbork Castle Triathlon (Full IM)"
    date: 2026-09-06
    bucket: full
    priority: A
    target_time: "9:30"
    target_swim: "~75'"
    stretch_note: "Stretch 9:20 = bike 4:57 + run 3:01."
    compare_to_date: 2025-09-07          # Malbork 2025 (last full IM)
    compare_note: >
      vs Malbork 2025 (10:35:52): run -40 min (the big, earned lever), bike
      -17 min (wheels+pacing), swim -5 min, T -3 min.
    splits:
      - { leg: "Swim 3.8 km", target: "1:15:00", detail: "1:58/100m -> your 75' target" }
      - { leg: "T1",          target: "3:30",  detail: "" }
      - { leg: "Bike 180 km", target: "5:02:00", detail: "~35.8 km/h @ 215-225 W (disc/aero)" }
      - { leg: "T2",          target: "2:30",  detail: "" }
      - { leg: "Run 42.2 km", target: "3:07:00", detail: "4:26/km" }

risk_note: >
  Risk ranking. (1) Run durability — the 2025 IM run faded to ~5:22/km; 4:26/km
  off the bike must be earned with long Z2 runs + race-pace bricks. (2) Swim base
  — held up by frequency. (3) Bike — the most bankable gain (equipment + position).
  Spend the wheel watts on a slightly easier bike to protect the run.

trajectory_note:
  - "Half: 5:50 (2023) -> 4:46 (Sieraków 2026) = -64 min / 3 yr."
  - "Quarter: 2:51-2:53 (2024) -> 2:18 (Mietków 2026) = -33 min."
  - "Full: 10:36 (2025) -> target 9:30 = -66 min, in line with trend."

# Week-by-week macro plan. Each week is either:
#   type: microcycle  -> generated by the swim-heavy build template (params below)
#   type: explicit    -> sessions listed verbatim (fixed/taper/recovery/race weeks)
# day = 0..6 offset from the week's Monday start. intensity = easy|moderate|hard.
weeks:
  - index: 1
    start: 2026-06-22
    phase: build
    focus: "Sharpen; honor fixed sessions; re-seat swim 3x"
    type: explicit
    sessions:
      - { day: 0, sport: bike, name: "Easy spin (completed)", intensity: easy, minutes: 75, desc: "Already logged." }
      - { day: 1, sport: swim, name: "Swim (completed)", intensity: easy, minutes: 45, desc: "Already logged." }
      - { day: 1, sport: run,  name: "Run easy (completed)", intensity: easy, minutes: 45, desc: "Already logged." }
      - { day: 2, sport: bike, name: "Z2 ride (completed)", intensity: easy, minutes: 75, desc: "Already logged." }
      - { day: 3, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 45, desc: "Establish the 3rd weekly swim immediately." }
      - { day: 3, sport: bike, name: "Anaerobic bike (planned)", intensity: hard, minutes: 75, desc: "As scheduled: anaerobic intervals, e.g. 6-8x1-2' @ 120-150% FTP, full recoveries." }
      - { day: 4, sport: bike, name: "Z2 brick ride (planned)", intensity: easy, minutes: 120, desc: "As scheduled." }
      - { day: 4, sport: run,  name: "Brick run (planned)", intensity: easy, minutes: 60, brick: true, desc: "As scheduled, off the bike." }
      - { day: 5, sport: run,  name: "Long run (planned)", intensity: easy, minutes: 90, desc: "As scheduled, Saturday AM." }
      - { day: 5, sport: swim, name: "Swim easy", intensity: easy, minutes: 40, desc: "Short aerobic swim, limiter volume." }

  - index: 2
    start: 2026-06-29
    phase: build
    focus: "Pre-Syców peak: half-IM race-pace brick"
    type: microcycle
    microcycle: { target_h: 10.2, key: hard, long_ride_h: 2.75, long_run_h: 1.5, half_focus: true }
    extra_sessions:
      - { day: 6, sport: bike, name: "Half-IM pace brick (bike)", intensity: moderate, minutes: 50, desc: "50' with 2x15' @ 90-95% FTP (~252-266 W) = Syców target power." }
      - { day: 6, sport: run,  name: "Half-IM pace brick (run)", intensity: moderate, minutes: 25, brick: true, desc: "25' off the bike @ 4:25-4:35/km = Syców target run pace." }

  - index: 3
    start: 2026-07-06
    phase: taper
    focus: "Mini-taper -> RACE Syców (Sun)"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim easy + 4x50 fast", intensity: easy, minutes: 40, desc: "Openers, stay sharp." }
      - { day: 1, sport: bike, name: "Bike openers", intensity: moderate, minutes: 60, desc: "3x3' @ race power + 3x30s fast." }
      - { day: 1, sport: run,  name: "Brick run short", intensity: easy, minutes: 20, brick: true, desc: "10' off bike @ race pace." }
      - { day: 2, sport: swim, name: "Swim race-pace feel", intensity: moderate, minutes: 35, desc: "6x100 @ race pace, long rests." }
      - { day: 3, sport: run,  name: "Run easy + strides", intensity: easy, minutes: 35, desc: "4x20s strides; legs snappy." }
      - { day: 4, sport: bike, name: "Spin + openers", intensity: easy, minutes: 40, desc: "Few 30s efforts, otherwise easy." }
      - { day: 5, sport: swim, name: "Swim shakeout", intensity: easy, minutes: 20, desc: "Short, pre-race feel." }
      - { day: 5, sport: run,  name: "Shakeout jog", intensity: easy, minutes: 20, desc: "15-20' easy + 3 strides." }
      - { day: 6, sport: other, name: "RACE: Syców 1/2 IM", intensity: moderate, minutes: 260, category: race, tss: 305, desc: "Target 4:20. Swim 35-36' / T1 / bike ~2:20 @ 250-265 W / T2 / run ~1:25 @ 4:25-4:35/km." }

  - index: 4
    start: 2026-07-13
    phase: transition
    focus: "Post-race reset / aerobic rebuild"
    type: explicit
    sessions:
      - { day: 0, sport: other, name: "Off / walk", intensity: easy, minutes: 30, desc: "Full recovery day after the race." }
      - { day: 1, sport: swim, name: "Swim recovery", intensity: easy, minutes: 40, desc: "Loosen up, technique only." }
      - { day: 2, sport: bike, name: "Easy spin", intensity: easy, minutes: 60, desc: "Z1-2 flush." }
      - { day: 2, sport: run,  name: "Run easy", intensity: easy, minutes: 30, desc: "Short, easy." }
      - { day: 3, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 50, desc: "Back to swim volume." }
      - { day: 4, sport: bike, name: "Bike tempo (light)", intensity: moderate, minutes: 60, desc: "2x15' @ 85-90% FTP; re-engage." }
      - { day: 5, sport: bike, name: "Long ride (Z2)", intensity: easy, minutes: 150, desc: "Rebuild aerobic base on TT bike." }
      - { day: 5, sport: run,  name: "Brick run", intensity: easy, minutes: 25, brick: true, desc: "Short brick off the ride." }
      - { day: 6, sport: run,  name: "Long run (Z2)", intensity: easy, minutes: 75, desc: "Easy aerobic; no intensity." }

  - index: 5
    start: 2026-07-20
    phase: build
    focus: "IM build 1 — volume up, TT-bike aero, intro brick"
    type: microcycle
    microcycle: { target_h: 13.0, key: hard, long_ride_h: 3.0, long_run_h: 1.5, brick_run_h: 0.75 }

  - index: 6
    start: 2026-07-27
    phase: build
    focus: "IM build 2 — first 4h+2h race-sim brick"
    type: microcycle
    microcycle: { target_h: 14.3, key: moderate, long_ride_h: 4.0, long_run_h: 0, brick_run_h: 2.0 }

  - index: 7
    start: 2026-08-03
    phase: build
    is_recovery: true
    focus: "Recovery valley (absorb the block)"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim technique", intensity: easy, minutes: 45, desc: "Easy, form." }
      - { day: 1, sport: bike, name: "Bike short tempo", intensity: moderate, minutes: 60, desc: "2x12' @ 88-92% FTP, otherwise easy." }
      - { day: 2, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 45, desc: "Steady." }
      - { day: 2, sport: run,  name: "Run easy", intensity: easy, minutes: 40, desc: "Z2." }
      - { day: 4, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 40, desc: "Keep frequency." }
      - { day: 5, sport: bike, name: "Ride moderate", intensity: easy, minutes: 120, desc: "Z2 only; absorb the block." }
      - { day: 6, sport: run,  name: "Long run (easy)", intensity: easy, minutes: 80, desc: "Cut volume; stay aerobic." }

  - index: 8
    start: 2026-08-10
    phase: build
    focus: "IM build 3 — 4h+2h race-sim brick"
    type: microcycle
    microcycle: { target_h: 15.0, key: moderate, long_ride_h: 4.0, long_run_h: 0, brick_run_h: 2.0 }

  - index: 9
    start: 2026-08-17
    phase: build
    focus: "IM peak — biggest week, 4.5h+2h brick"
    type: microcycle
    microcycle: { target_h: 16.0, key: moderate, long_ride_h: 4.5, long_run_h: 0, brick_run_h: 2.0 }

  - index: 10
    start: 2026-08-24
    phase: taper
    focus: "Taper 1 — volume down, keep sharpness"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 45, desc: "Volume coming down." }
      - { day: 1, sport: bike, name: "Bike race-power touches", intensity: moderate, minutes: 75, desc: "3x10' @ IM power (~215-230 W)." }
      - { day: 2, sport: swim, name: "Swim race-pace", intensity: moderate, minutes: 40, desc: "IM swim pace feel." }
      - { day: 2, sport: run,  name: "Run easy + strides", intensity: easy, minutes: 40, desc: "Sharpen." }
      - { day: 3, sport: bike, name: "Bike tempo (light)", intensity: moderate, minutes: 60, desc: "2x12' @ sweet spot." }
      - { day: 4, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 40, desc: "Keep feel." }
      - { day: 5, sport: bike, name: "Last long ride", intensity: easy, minutes: 150, desc: "2.5h @ IM power, dress-rehearse fuel + position." }
      - { day: 5, sport: run,  name: "Brick run", intensity: easy, minutes: 20, brick: true, desc: "Short brick @ IM run pace." }
      - { day: 6, sport: run,  name: "Long run (reduced)", intensity: easy, minutes: 80, desc: "Last longer run; easy." }

  - index: 11
    start: 2026-08-31
    phase: taper
    focus: "Taper 2 -> RACE Malbork (Sun)"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim easy + pace", intensity: easy, minutes: 35, desc: "Short, 4x100 @ IM pace." }
      - { day: 1, sport: bike, name: "Bike openers", intensity: moderate, minutes: 50, desc: "3x5' @ IM power + 3x30s." }
      - { day: 2, sport: run,  name: "Run easy + strides", intensity: easy, minutes: 30, desc: "4x20s strides." }
      - { day: 3, sport: swim, name: "Swim shakeout", intensity: easy, minutes: 25, desc: "Feel for the water." }
      - { day: 3, sport: bike, name: "Spin", intensity: easy, minutes: 30, desc: "Legs open." }
      - { day: 4, sport: bike, name: "Pre-race openers", intensity: moderate, minutes: 30, desc: "A few race-power touches." }
      - { day: 4, sport: run,  name: "Shakeout", intensity: easy, minutes: 15, desc: "10-15' + strides." }
      - { day: 5, sport: swim, name: "Swim shakeout", intensity: easy, minutes: 15, desc: "Pre-race; very short." }
      - { day: 6, sport: other, name: "RACE: Malbork Full IM", intensity: easy, minutes: 570, category: race, tss: 465, desc: "Target 9:30 (stretch 9:20). Swim 75' / bike ~5:00-5:10 @ 210-230 W (disc/aero) / run ~3:05-3:15." }
