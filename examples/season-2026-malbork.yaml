# Season spec — the single athlete/season-specific input to the plan + report
# engines. Everything here is data, not code: edit this file (or copy it) to
# build a plan for a different athlete or season. The periodization engine
# (scripts/build_plan.py) and the report engine (scripts/build_report.py) read
# it and stay generic.
#
# This particular file is the committed EXAMPLE: a real 2026 season (used with
# the athlete's consent) so the scripts run end-to-end out of the box against
# examples/data/.

meta:
  athlete_id: athlete
  plan_id: goal-2026-malbork
  start_date: 2026-06-22
  starting_ctl: 69.0
  title: "Aithlete — Season Plan & Analysis"
  # Phase-specific weekly-hour envelope (documented in the report).
  volume_ceiling_hours:
    to_first_race: 14
    after_first_race: 17
  # Critical swim speed, fed into swim session targets. Re-baselined 2026-07-01:
  # 20x100 on 2:00 averaged 1:43/100 (1:37 -> 1:47 positive split), so the old
  # 1:50-1:55 assumption was stale.
  swim_css: "1:45-1:48/100m"
  equipment_note: >
    New disc rear wheel on the TT bike (bought pre-2025 Castle). Athlete estimate
    20-30 W saved at race speed. At IM power/speed that is ~+1.0-1.3 km/h, i.e.
    6-9 min over 180 km (3-5 min over 90 km) or the same speed at lower normalized
    power — we spend part on speed, part on fresher legs for the run.
  rationale: >
    Two-peak season. Syców 1/2 IM (2026-07-12) is a B-race tune-up off a 5-day
    mini-taper; the A-race is Malbork full IM (2026-09-06). Block order: sharpen
    (W1-2) -> Syców -> reset (W4) -> IM build (W5-9 with a recovery valley W7) ->
    2-week taper. Swim is the limiter (CTL 4.1, ~6h/8wk) so swim freq is held at
    >=3/wk throughout. Bike volume is on the TT bike in race position to convert
    the new disc/aero setup (~20-30 W) into a free IM bike split. The IM block
    runs 4h+2h race-simulation bricks (W6/W8 4.0h ride + 2.0h IM-pace run, W9
    4.5h + 2.0h) in place of a standalone long run those weeks — the athlete has
    used 3+2 bricks durably before and the run is the A-race lever, so we rehearse
    race legs directly. Peak weekly volume is pushed toward the 16-17h ceiling
    (W9 ~16.5h) while staying inside the ramp/ACWR guardrails.

# The A-race becomes the plan's goal_race (drives taper/TSB validation).
# target_splits + compare_* feed the report's "Target race splits" section.
races:
  - name: "Syców 1/2 IM"
    date: 2026-07-12
    bucket: "1/2"
    priority: B
    target_time: "4:20"
    target_swim: "35-36'"
    compare_to_date: 2026-05-30          # Sieraków 2026 (most recent half)
    compare_note: >
      vs Sieraków 2026 (4:45:50): bike -14 min (wheels+fitness), transitions
      -7 min (T1+T2 were 10:55!), run -4 min, swim flat -> ~-26 min.
    splits:
      - { leg: "Swim 1.9 km", target: "36:00", detail: "1:54/100m (wetsuit/OW)" }
      - { leg: "T1",          target: "2:00",  detail: "tighten vs 4:28 in Sieraków" }
      - { leg: "Bike 90 km",  target: "2:16:00", detail: "~39.7 km/h @ 250-262 W (disc/aero)" }
      - { leg: "T2",          target: "1:30",  detail: "tighten vs 6:27 in Sieraków" }
      - { leg: "Run 21.1 km", target: "1:24:30", detail: "4:00/km" }

  - name: "Malbork Castle Triathlon (Full IM)"
    date: 2026-09-06
    bucket: full
    priority: A
    target_time: "9:30"
    target_swim: "~75'"
    stretch_note: "Stretch 9:20 = bike 4:57 + run 3:01."
    compare_to_date: 2025-09-07          # Malbork 2025 (last full IM)
    compare_note: >
      vs Malbork 2025 (10:35:52): run -40 min (the big, earned lever), bike
      -17 min (wheels+pacing), swim -5 min, T -3 min.
    splits:
      - { leg: "Swim 3.8 km", target: "1:15:00", detail: "1:58/100m -> your 75' target" }
      - { leg: "T1",          target: "3:30",  detail: "" }
      - { leg: "Bike 180 km", target: "5:02:00", detail: "~35.8 km/h @ ~200 W NP (disc/aero)" }
      - { leg: "T2",          target: "2:30",  detail: "" }
      - { leg: "Run 42.2 km", target: "3:07:00", detail: "4:26/km" }

risk_note: >
  Risk ranking. (1) Run durability — the 2025 IM run faded to ~5:22/km; 4:26/km
  off the bike must be earned with long Z2 runs + race-pace bricks. (2) Swim base
  — held up by frequency. (3) Bike — the most bankable gain (equipment + position).
  Spend the wheel watts on a slightly easier bike to protect the run.

trajectory_note:
  - "Half: 5:50 (2023) -> 4:46 (Sieraków 2026) = -64 min / 3 yr."
  - "Quarter: 2:51-2:53 (2024) -> 2:18 (Mietków 2026) = -33 min."
  - "Full: 10:36 (2025) -> target 9:30 = -66 min, in line with trend."

# Week-by-week macro plan. Each week is either:
#   type: microcycle  -> generated by the swim-heavy build template (params below)
#   type: explicit    -> sessions listed verbatim (fixed/taper/recovery/race weeks)
# day = 0..6 offset from the week's Monday start. intensity = easy|moderate|hard.
weeks:
  - index: 1
    start: 2026-06-22
    phase: build
    focus: "Sharpen; honor fixed sessions; re-seat swim 3x"
    type: explicit
    sessions:
      - { day: 0, sport: bike, name: "Easy spin (completed)", intensity: easy, minutes: 75, desc: "Already logged." }
      - { day: 1, sport: swim, name: "Swim (completed)", intensity: easy, minutes: 45, desc: "Already logged." }
      - { day: 1, sport: run,  name: "Run easy (completed)", intensity: easy, minutes: 45, desc: "Already logged." }
      - { day: 2, sport: bike, name: "Z2 ride (completed)", intensity: easy, minutes: 75, desc: "Already logged." }
      - { day: 3, sport: run,  name: "Threshold run 4x8' (completed)", intensity: moderate, minutes: 58, desc: "As executed: 4x8' threshold (IF 0.90). Replaced the planned 3rd swim." }
      - { day: 3, sport: bike, name: "Anaerobic bike (completed)", intensity: hard, minutes: 79, desc: "As executed: 12x25-40s @ ~360-378 W (~130% FTP), sprint/anaerobic-capacity flavor." }
      - { day: 4, sport: bike, name: "Z2 brick ride (planned)", intensity: easy, minutes: 120, desc: "As scheduled." }
      - { day: 4, sport: run,  name: "Brick run (planned)", intensity: easy, minutes: 60, brick: true, desc: "As scheduled, off the bike." }
      - { day: 5, sport: run,  name: "Long run (planned)", intensity: easy, minutes: 90, desc: "As scheduled, Saturday AM." }
      - { day: 5, sport: swim, name: "Swim easy", intensity: easy, minutes: 40, desc: "Short aerobic swim, limiter volume." }

  - index: 2
    start: 2026-06-29
    phase: build
    focus: "Pre-Syców peak: Sat half-IM race-sim brick, Sun long run"
    type: explicit
    sessions:
      - { day: 0, sport: swim,  name: "Swim technique + aerobic", intensity: easy, minutes: 50, desc: "Drills + 8-12x100 @ CSS+5s. Limiter focus." }
      - { day: 0, sport: other, name: "Strength (lower + core)", intensity: easy, minutes: 45, desc: "Posterior chain + core; injury prevention." }
      - { day: 1, sport: bike,  name: "Bike key set", intensity: hard, minutes: 45, desc: "VO2/threshold sharpener: 5x4' @ 110-118% FTP or 3x12' @ 95-100%." }
      - { day: 2, sport: swim,  name: "Swim threshold (completed)", intensity: moderate, minutes: 35, desc: "As executed: 20x100 on 2:00 avg 1:43/100 (1:37 -> 1:47). CSS re-baselined to 1:45-1:48." }
      - { day: 2, sport: run,   name: "Run easy + strides", intensity: easy, minutes: 40, desc: "Z2 + 6x20s strides." }
      - { day: 3, sport: bike,  name: "Bike Z2 endurance", intensity: easy, minutes: 75, desc: "Aerobic spin; keep it easy — the quality this week is Tue key + Sat race-sim." }
      - { day: 3, sport: run,  name: "Brick run Z2", intensity: easy, minutes: 60, brick: true, desc: "1h Z2 straight off the bike. Strictly easy — protect Saturday's race-sim." }
      - { day: 4, sport: swim,  name: "Swim aerobic endurance", intensity: easy, minutes: 60, desc: "15x200 on 4:00 @ ~1:50/100 (3:40/200), longer rest each 600m. One block buoy+snorkel, one snorkel-only, last block free full stroke." }
      - { day: 4, sport: other, name: "Mobility / core", intensity: easy, minutes: 30, desc: "Optional; keep easy." }
      - { day: 5, sport: bike,  name: "Half-IM race-sim ride", intensity: moderate, minutes: 155, desc: "TT bike in aero: 2x30' @ 90-95% FTP (~252-266 W = Syców target power), rest Z2. Fuel 70-90g carbs/h." }
      - { day: 5, sport: run,   name: "Half-IM pace brick run", intensity: moderate, minutes: 30, brick: true, desc: "Off the bike @ ~4:00/km = Syców target run pace. The key race rehearsal." }
      - { day: 6, sport: run,   name: "Long run (Z2)", intensity: easy, minutes: 105, desc: "Aerobic long run; separate day from the brick. Last 15-20' @ race effort if fresh." }

  - index: 3
    start: 2026-07-06
    phase: taper
    focus: "Mini-taper -> RACE Syców (Sun)"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim easy + 4x50 fast", intensity: easy, minutes: 40, desc: "Openers, stay sharp." }
      - { day: 1, sport: bike, name: "Bike openers", intensity: moderate, minutes: 60, desc: "3x3' @ race power + 3x30s fast." }
      - { day: 1, sport: run,  name: "Brick run short", intensity: easy, minutes: 20, brick: true, desc: "10' off bike @ ~4:00/km race pace." }
      - { day: 2, sport: swim, name: "Swim race-pace feel", intensity: moderate, minutes: 35, desc: "6x100 @ race pace, long rests." }
      - { day: 3, sport: run,  name: "Run easy + strides", intensity: easy, minutes: 35, desc: "4x20s strides; legs snappy." }
      - { day: 4, sport: bike, name: "Spin + openers", intensity: easy, minutes: 40, desc: "Few 30s efforts, otherwise easy." }
      - { day: 5, sport: swim, name: "Swim shakeout", intensity: easy, minutes: 20, desc: "Short, pre-race feel." }
      - { day: 5, sport: run,  name: "Shakeout jog", intensity: easy, minutes: 20, desc: "15-20' easy + 3 strides." }
      - { day: 6, sport: other, name: "RACE: Syców 1/2 IM", intensity: moderate, minutes: 260, category: race, tss: 305, desc: "Target 4:20. Swim 35-36' / T1 / bike ~2:20 @ 250-265 W / T2 / run ~1:25 @ ~4:00/km." }

  - index: 4
    start: 2026-07-13
    phase: transition
    focus: "Post-race reset / aerobic rebuild"
    type: explicit
    sessions:
      - { day: 0, sport: other, name: "Off / walk (completed)", intensity: easy, minutes: 30, desc: "Full recovery day after the race." }
      - { day: 1, sport: swim,  name: "Swim recovery (completed)", intensity: easy, minutes: 40, desc: "Loosen up, technique only; swim feeling strong post-Syców." }
      - { day: 2, sport: bike,  name: "Easy spin (planned)", intensity: easy, minutes: 60, desc: "Z1-2 flush." }
      - { day: 2, sport: run,   name: "Run easy (planned)", intensity: easy, minutes: 30, desc: "Short, easy." }
      - { day: 3, sport: other, name: "Gym (planned)", intensity: moderate, minutes: 75, desc: "Harder gym ~75', but not leg-killer — upper/core + light posterior chain so tempo bike stays clean after." }
      - { day: 3, sport: bike,  name: "Bike tempo (light)", intensity: moderate, minutes: 60, desc: "2x15' @ 85-90% FTP; re-engage after gym." }
      - { day: 4, sport: swim,  name: "Swim aerobic", intensity: easy, minutes: 50, desc: "Back to swim volume; keep the Tue/Fri swim frequency." }
      - { day: 5, sport: bike,  name: "Long ride (Z2)", intensity: easy, minutes: 150, desc: "Rebuild aerobic base on TT bike." }
      - { day: 5, sport: run,   name: "Brick run", intensity: easy, minutes: 25, brick: true, desc: "Short brick off the ride." }
      - { day: 6, sport: run,   name: "Long run (Z2)", intensity: easy, minutes: 75, desc: "Easy aerobic; no intensity." }

  - index: 5
    start: 2026-07-20
    phase: build
    focus: "IM build 1 — volume up, TT-bike aero, intro IM-pace"
    type: microcycle
    microcycle: { target_h: 13.0, key: hard, long_ride_h: 3.0, long_run_h: 1.5, brick_run_h: 0.75, long_ride_blocks: "3x20' @ 200 W" }

  - index: 6
    start: 2026-07-27
    phase: build
    focus: "IM build 2 — first 4h+2h race-sim brick, IM-pace bike"
    type: microcycle
    microcycle: { target_h: 14.3, key: moderate, long_ride_h: 4.0, long_run_h: 0, brick_run_h: 2.0, long_ride_blocks: "4x30' @ 200 W" }

  - index: 7
    start: 2026-08-03
    phase: build
    is_recovery: true
    focus: "Lighter down-week — cut volume, keep sharpness (not a rest week)"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim technique + speed", intensity: easy, minutes: 50, desc: "Drills + 6x50 fast; form + a little snap." }
      - { day: 1, sport: bike, name: "Bike sharpener (short)", intensity: moderate, minutes: 55, desc: "3x8' @ 90-95% FTP (~250 W). Hold sharpness on low volume." }
      - { day: 2, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 45, desc: "Steady; keep frequency." }
      - { day: 2, sport: run,  name: "Run easy + strides", intensity: easy, minutes: 40, desc: "Z2 + 6x20s strides." }
      - { day: 3, sport: bike, name: "Easy spin", intensity: easy, minutes: 50, desc: "Z1-2 flush; legs open." }
      - { day: 4, sport: swim, name: "Swim race-pace", intensity: moderate, minutes: 40, desc: "8x100 @ CSS, long rests; keep race feel." }
      - { day: 5, sport: bike, name: "IM-pace ride (reduced)", intensity: easy, minutes: 110, desc: "2x20' @ 200 W inside a Z2 ride; race position + fuel." }
      - { day: 5, sport: run,  name: "Brick run (short)", intensity: easy, minutes: 20, brick: true, desc: "Short brick @ IM pace off the ride." }
      - { day: 6, sport: run,  name: "Long run (reduced)", intensity: easy, minutes: 80, desc: "Cut volume; stay aerobic." }

  - index: 8
    start: 2026-08-10
    phase: build
    focus: "IM build 3 — 4h+2h race-sim brick, big IM-pace volume"
    type: microcycle
    microcycle: { target_h: 15.0, key: moderate, long_ride_h: 4.0, long_run_h: 0, brick_run_h: 2.0, long_ride_blocks: "6x30' @ 200 W" }

  - index: 9
    start: 2026-08-17
    phase: build
    focus: "IM peak — biggest week, 4.5h+2h brick at IM pace"
    type: microcycle
    microcycle: { target_h: 16.0, key: moderate, long_ride_h: 4.5, long_run_h: 0, brick_run_h: 2.0, long_ride_blocks: "3x40' @ 200 W" }

  - index: 10
    start: 2026-08-24
    phase: taper
    focus: "Taper 1 — volume down, keep sharpness"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 45, desc: "Volume coming down." }
      - { day: 1, sport: bike, name: "Bike race-power touches", intensity: moderate, minutes: 75, desc: "3x10' @ IM power (~200 W)." }
      - { day: 2, sport: swim, name: "Swim race-pace", intensity: moderate, minutes: 40, desc: "IM swim pace feel." }
      - { day: 2, sport: run,  name: "Run easy + strides", intensity: easy, minutes: 40, desc: "Sharpen." }
      - { day: 3, sport: bike, name: "Bike tempo (light)", intensity: moderate, minutes: 60, desc: "2x12' @ sweet spot." }
      - { day: 4, sport: swim, name: "Swim aerobic", intensity: easy, minutes: 40, desc: "Keep feel." }
      - { day: 5, sport: bike, name: "Last long ride", intensity: easy, minutes: 150, desc: "2.5h with blocks @ IM power (~200 W), dress-rehearse fuel + position." }
      - { day: 5, sport: run,  name: "Brick run", intensity: easy, minutes: 20, brick: true, desc: "Short brick @ IM run pace." }
      - { day: 6, sport: run,  name: "Long run (reduced)", intensity: easy, minutes: 80, desc: "Last longer run; easy." }

  - index: 11
    start: 2026-08-31
    phase: taper
    focus: "Taper 2 -> RACE Malbork (Sun)"
    type: explicit
    sessions:
      - { day: 0, sport: swim, name: "Swim easy + pace", intensity: easy, minutes: 35, desc: "Short, 4x100 @ IM pace." }
      - { day: 1, sport: bike, name: "Bike openers", intensity: moderate, minutes: 50, desc: "3x5' @ IM power (~200 W) + 3x30s." }
      - { day: 2, sport: run,  name: "Run easy + strides", intensity: easy, minutes: 30, desc: "4x20s strides." }
      - { day: 3, sport: swim, name: "Swim shakeout", intensity: easy, minutes: 25, desc: "Feel for the water." }
      - { day: 3, sport: bike, name: "Spin", intensity: easy, minutes: 30, desc: "Legs open." }
      - { day: 4, sport: bike, name: "Pre-race openers", intensity: moderate, minutes: 30, desc: "A few race-power touches." }
      - { day: 4, sport: run,  name: "Shakeout", intensity: easy, minutes: 15, desc: "10-15' + strides." }
      - { day: 5, sport: swim, name: "Swim shakeout", intensity: easy, minutes: 15, desc: "Pre-race; very short." }
      - { day: 6, sport: other, name: "RACE: Malbork Full IM", intensity: easy, minutes: 570, category: race, tss: 465, desc: "Target 9:30 (stretch 9:20). Swim 75' / bike ~5:00-5:10 @ ~200 W NP (disc/aero) / run ~3:05-3:15." }
