# Season spec — Wolsztyn closer (2026-09-19) -> Syców 70.3 (2027-07-11) -> Barcelona 2027.
# Barcelona 2027 official date is not published yet; we use Sun 2027-10-03
# (first Sunday of October, same pattern as 2026-10-04). Syców 2027 is also
# unpublished; we use Sun 2027-07-11 (second Sunday of July, same pattern as
# 2026-07-12). Edit if GTT / IRONMAN announce otherwise.
#
# Malbork 2026-09-06: DNF (Shimano Di2). Swim 1:22 in 17.2 C water; ~45 km of bike
# before mechanical. Fitness was there for ~9:10 on a normal day.

meta:
  athlete_id: athlete
  plan_id: goal-2027-barcelona
  start_date: 2026-09-07
  starting_ctl: 69.4
  title: "Aithlete — Barcelona 2027 (8:50) + Syców sub-4"
  volume_ceiling_hours:
    to_first_race: 12
    after_first_race: 17
  swim_css: "1:45-1:48/100m"
  equipment_note: >
    Disc/aero TT setup remains the bike-speed lever on Barcelona's fast course.
    Shimano Di2 failed at Malbork — fix or replace before Wolsztyn; race only on
    a shifting bike. Recalibrate PM vs Kickr after any workshop visit.
  rationale: >
    Close 2026 with GREATMAN Wolsztyn 70.3 (B-race, 12 days post-Malbork DNF).
    Malbork was a mechanical DNF at ~45 km, not a finished IM — no transition
    unload. Week 1 resumes quality (anaerobic bike hole + swim volume) then
    eases into a mini-taper. Residual IM fitness is enough for a controlled
    ~4:20 70.3. Then winter base, spring 70.3-specific build into Garmin
    Syców (B-peak, stretch 3:59), one-week reset, then IM-specific 4h+2h bricks
    and a 2-week taper into Barcelona (A-goal 8:50). Syców is a real race, not a
    workout — mini-taper, race-power openers — but the bike is capped at ~260 W
    NP so the run can hold ~3:36/km and Barcelona's 2:59 is not spent in July.
    Swim limiter is cold/OW skill not CSS; hold >=3 swims/week.

races:
  - name: "GREATMAN Wolsztyn 70.3"
    date: 2026-09-19
    bucket: "1/2"
    priority: B
    target_time: "4:20"
    target_swim: "34-36'"
    compare_to_date: 2026-07-12
    compare_note: >
      vs Syców 2026 (4:24:05). Same fitness, short turnaround after Malbork DNF
      and a cold. Race controlled; not a breakthrough attempt.
    splits:
      - { leg: "Swim 1.9 km", target: "35:00", detail: "1:50/100m OW; don't freeze the arms" }
      - { leg: "T1",          target: "2:00",  detail: "" }
      - { leg: "Bike 90 km",  target: "2:16:00", detail: "~39.7 km/h @ ~250 W (race PM)" }
      - { leg: "T2",          target: "1:30",  detail: "" }
      - { leg: "Run 21.1 km", target: "1:25:00", detail: "~4:02/km; first 5 km slower" }

  - name: "Garmin Triathlon Tour Syców 1/2 IM"
    date: 2027-07-11
    bucket: "1/2"
    priority: B
    target_time: "3:59"
    target_swim: "33'"
    stretch_note: >
      3:59 = 33' / 2:08 @ 255-260 W NP / 1:16. Bankable line is 4:05 if the
      bike is slower; do not chase 3:59 by riding 270 W.
    compare_to_date: 2026-07-12
    compare_note: >
      vs Syców 2026 (4:24:05). ~25 min has to come from swim (~3'), T (~1'),
      bike (~8') and run (~10') — Syców is a fast course, but the run only
      holds if the bike stays ≤260 W NP.
    splits:
      - { leg: "Swim 1.9 km", target: "33:00", detail: "1:44-1:46/100m OW; CSS is 1:45-1:48" }
      - { leg: "T1",          target: "1:20",  detail: "sub-4 lives in T as well" }
      - { leg: "Bike 90 km",  target: "2:08:00", detail: "~42.2 km/h @ 255-260 W NP; hard cap 260 W" }
      - { leg: "T2",          target: "0:50",  detail: "" }
      - { leg: "Run 21.1 km", target: "1:16:00", detail: "3:36/km; first 3 km ~3:42" }

  - name: "IRONMAN Calella-Barcelona"
    date: 2027-10-03
    bucket: full
    priority: A
    target_time: "8:50"
    target_swim: "~1:08"
    stretch_note: "8:50 = 1:08 swim + 4:38 bike + 2:59 run + ~5 min T. Fast course."
    compare_to_date: 2026-09-06
    compare_note: >
      Malbork 2026 DNF (Di2) after 1:22 swim in 17.2 C. Fitness was ~9:10
      (70'/4:50/3:05). Barcelona is faster/warmer; 8:50 is a year of swim-OW,
      +10-15 W IM power, and holding a 4:15/km marathon off the bike.
    splits:
      - { leg: "Swim 3.8 km", target: "1:08:00", detail: "1:47/100m, wetsuit sea; CSS is already here" }
      - { leg: "T1",          target: "3:00",  detail: "" }
      - { leg: "Bike 180 km", target: "4:38:00", detail: "~38.8 km/h @ ~210 W NP (fast course + aero)" }
      - { leg: "T2",          target: "2:00",  detail: "" }
      - { leg: "Run 42.2 km", target: "2:59:00", detail: "4:15/km; first 10 km 4:20-4:25" }

risk_note: >
  (1) Mechanical reliability — Di2 DNF. (2) Cold-water swim — 1:22 at Malbork
  was environment not CSS; train OW and warm-up better. (3) Run off a faster
  bike — 8:50 dies if 4:38 is ridden at 230 W. (4) Don't smash Wolsztyn sick.
  (5) Syców sub-4 — the 70.3 bike cap is 260 W NP; a 270 W 2:05 with a 1:22
  shuffle is a 4:10 and a worse Barcelona.

trajectory_note:
  - "Half: 4:24 (Syców 2026) -> ~4:20 Wolsztyn closer -> 3:59 Syców 2027 (stretch)."
  - "Full: 10:36 (2025) -> ~9:10 fitness (2026, unrun) -> 8:50 Barcelona 2027."

