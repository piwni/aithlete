# Aithlete readiness / monitoring rulebook — PARAMETERIZED.
#
# `analysis/readiness.py` loads this to turn daily health metrics into red/amber/
# green flags + a recommended action. Aggregation is WORST-WINS: the overall
# readiness flag is the worst flag across all rules. These flags GATE the
# adjust-plan skill (they can force a deload or rest day).
#
# Sources cited per rule. Defaults are conservative.
schema_version: 1

# Flag colors and the action the adjust-plan skill should take.
actions:
  green:  "proceed as planned"
  amber:  "reduce intensity / volume today; convert hard sessions to aerobic"
  red:    "rest or active recovery only; re-evaluate tomorrow"

rules:
  # HRV (rMSSD, ms) vs a 60-day rolling baseline.
  # SWC = smallest worthwhile change = 0.5 * within-person CV of the baseline.
  # A drop beyond SWC for a single day = amber; sustained (>=3 of last 4 days) = red.
  # Ref: Plews et al., "Training adaptation and HRV in elite endurance athletes";
  # Hopkins (smallest worthwhile change).
  hrv:
    input: "rMSSD daily vs 60-day baseline mean and CV"
    swc_multiplier: 0.5            # SWC = 0.5 * CV (as a fraction of baseline mean)
    amber_if_below_baseline_by_swc: true
    red_if_below_for_days: 3       # within a 4-day window
    red_window_days: 4
    # Also flag suppressed variability of the baseline itself (parasympathetic saturation).
    trend_drop_pct_amber: 7        # 7-day rolling mean down >7% vs 60-day -> amber

  # Resting HR (bpm) elevation vs baseline.
  # Ref: classic overreaching markers; Friel.
  resting_hr:
    input: "morning RHR vs 30-day baseline"
    amber_elevation_bpm: 5
    red_elevation_bpm: 10
    amber_elevation_pct: 8

  # Sleep debt over a trailing window.
  sleep:
    input: "actual vs need (default need 8h)"
    need_hours: 8.0
    window_days: 3
    amber_debt_hours: 3.0          # cumulative deficit over the window
    red_debt_hours: 6.0
    red_single_night_hours: 4.0    # one catastrophic night

  # Acute:Chronic Workload Ratio (ACWR) — injury risk.
  # Sweet spot 0.8-1.3; danger zone >1.5. Ref: Gabbett, "training-injury prevention paradox".
  acwr:
    input: "7-day load / 28-day load (TSS)"
    sweet_spot: [0.8, 1.3]
    amber_above: 1.3
    red_above: 1.5
    amber_below: 0.8               # detraining / under-load also flagged (amber)

  # Subjective wellness (1-5 scale per item: sleep, fatigue, stress, soreness, mood;
  # 5 = best). Daily sRPE-style check-in. Ref: McLean et al.; Hooper index.
  subjective_wellness:
    input: "mean of 5 items, 1-5 (5 best)"
    amber_below: 3.0
    red_below: 2.0

  # Training monotony & strain (Foster). High monotony + high load = overtraining risk.
  # monotony = mean daily load / SD daily load (7d); strain = weekly load * monotony.
  # Ref: Foster, "Monitoring training in athletes with reference to overtraining syndrome".
  monotony:
    input: "7-day daily-load mean/SD"
    amber_above: 2.0
    red_above: 2.5

  # Illness: above-neck vs below-neck symptom rule -> return to play.
  # Ref: "neck check" guidance (Eichner); consensus return-to-sport after illness.
  illness:
    above_neck: # runny nose, sneezing, mild sore throat, no fever
      flag: amber
      action: "easy aerobic only at reduced volume; stop if symptoms worsen"
    below_neck: # fever, chest congestion, body aches, GI symptoms
      flag: red
      action: "no training until symptom-free; then graded return"
    return_to_play_steps:
      - "Day 1-2 symptom-free: easy 20-30 min aerobic"
      - "Day 3: moderate aerobic, monitor RHR/HRV"
      - "Day 4+: resume intensity only if HRV/RHR back to baseline"
    fever_red_temp_c: 37.8

# Aggregation: overall flag = worst across all rules above.
aggregation: worst-wins
